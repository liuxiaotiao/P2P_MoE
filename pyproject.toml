[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "p2pmoe"
version = "0.1.0"
description = "P2P MoE 双段模型放置优化 —— 分散环境 serving 框架"
requires-python = ">=3.10"
# 与 requirements.txt 保持一致（tests/test_requirements.py 会校验实际 import）
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
# 模型执行层（TODO.md P0）落地时再启用；届时只有跑推理的节点需要，控制机不用。
# 注意没有 accelerate —— 它的 device_map 正是本方案要替换的东西，理由见
# requirements.txt 的注释与 TODO.md 的 P0 条目。
# node = ["torch>=2.1", "transformers>=4.40", "safetensors>=0.4"]

[tool.setuptools.packages.find]
include = ["p2pmoe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 起真实进程的端到端测试"]
